[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myelin"
version = "0.1.0"
description = "MYELIN: Stress-Driven Deep-to-Shallow Synaptic Consolidation at Test Time"
authors = [{ name = "Giorgio Nicolas de A. Bertino" }]
requires-python = ">=3.12"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
